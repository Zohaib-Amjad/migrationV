<title>HOF Migration Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="styles.css" />

<section class="hero">
  <img class="hero__bg" src="assets/hero-bg.jpg" alt="" />

  <div class="hero__inner">
    <header class="nav">
      <div class="nav__group">
        <a href="/" class="nav__logo">
          <img src="assets/icons/logo-mark.svg" alt="" class="nav__logo-mark" />
          <span>HOF Migration</span>
        </a>

        <nav class="nav__links" aria-label="Primary">
          <a href="#services" class="nav__link nav__link--dropdown">
            Services
            <img src="assets/icons/chevron-down.svg" alt="" class="nav__chevron" />
          </a>
          <a href="#destinations" class="nav__link">Destinations</a>
          <a href="#about" class="nav__link">About Us</a>
        </nav>
      </div>

      <div class="nav__group nav__group--right">
        <a href="#" class="nav__lang" dir="auto">العربية</a>
        <span class="nav__divider" aria-hidden="true"></span>
        <button type="button" class="nav__icon-btn" aria-label="Change language / region">
          <img src="assets/icons/globe.svg" alt="" />
        </button>
        <a href="#consultation" class="btn btn--light">
          Book a free consultation
          <img src="assets/icons/arrow-up-right.svg" alt="" class="btn__icon" />
        </a>
      </div>
    </header>

    <div class="hero__content">
      <div class="badge">
        <img src="assets/icons/badge-icon.png" alt="" class="badge__icon" />
        <span class="badge__text">ICCRC &amp; MARA Certified</span>
        <span class="badge__logos">
          <img src="assets/icons/partner-logo-1.png" alt="ICCRC" class="badge__logo" />
          <img src="assets/icons/partner-logo-2.png" alt="MARA" class="badge__logo" />
        </span>
      </div>

      <div class="hero__copy">
        <h1 class="hero__title">
          The GCC&rsquo;s <em>#1</em><br />
          Trusted Immigration Consultancy
        </h1>
        <p class="hero__subtitle">Your right migration starts with the right guidance</p>
      </div>

      <a href="#contact" class="btn btn--dark">
        Let&rsquo;s Talk
        <img src="assets/icons/arrow-up-right-white.svg" alt="" class="btn__icon" />
      </a>
    </div>
  </div>
</section>
