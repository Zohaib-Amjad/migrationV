<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HOF Migration — Airplane Window Hero Concept</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles-window.css" />
</head>
<body>

  <section class="hero-v2">
    <div class="hero-v2__inner">
      <header class="nav">
        <div class="nav__group">
          <a href="/" class="nav__logo">
            <img src="assets/icons-v2/logo-mark.svg" alt="" class="nav__logo-mark" />
            <span>HOF Migration</span>
          </a>

          <nav class="nav__links" aria-label="Primary">
            <a href="#services" class="nav__link nav__link--dropdown">
              Services
              <img src="assets/icons-v2/chevron-down.svg" alt="" class="nav__chevron" />
            </a>
            <a href="#destinations" class="nav__link">Destinations</a>
            <a href="#about" class="nav__link">About Us</a>
          </nav>
        </div>

        <div class="nav__group nav__group--right">
          <a href="#" class="nav__lang" dir="auto">العربية</a>
          <span class="nav__divider" aria-hidden="true"></span>
          <button type="button" class="nav__icon-btn" aria-label="Change language / region">
            <img src="assets/icons-v2/globe.svg" alt="" />
          </button>
          <a href="#consultation" class="btn btn--panel">
            Book a free consultation
            <img src="assets/icons-v2/arrow-up-right.svg" alt="" class="btn__icon" />
          </a>
        </div>
      </header>

      <div class="hero-v2__row">
        <div class="hero-v2__content">
          <div class="badge">
            <img src="assets/icons-v2/badge-icon.png" alt="" class="badge__icon" />
            <span class="badge__text">ICCRC &amp; MARA Certified</span>
            <span class="badge__logos">
              <img src="assets/icons-v2/partner-logo-1.png" alt="ICCRC" class="badge__logo" />
              <img src="assets/icons-v2/partner-logo-2.png" alt="MARA" class="badge__logo" />
            </span>
          </div>

          <div class="hero-v2__copy">
            <h1 class="hero-v2__title">The Gulf&rsquo;s #1<br />Trusted Immigration Consultancy</h1>
            <p class="hero-v2__subtitle">Your Right Migration Starts With The Right Guidance</p>
          </div>

          <a href="#contact" class="btn btn--white">
            Let&rsquo;s Talk
            <img src="assets/icons-v2/arrow-up-right.svg" alt="" class="btn__icon" />
          </a>
        </div>

        <!--
          Airplane window — the visual centerpiece of this concept.
          `data-carousel` drives the crossfade in carousel.js. Slides are
          temporary placeholders (one real sky photo + two stylised
          gradient "destinations") standing in for the final photography.
        -->
        <div class="window">
          <div class="window__bezel"></div>
          <div class="window__groove"></div>
          <div class="window__glass" data-carousel data-interval="5000">
            <div class="window__slide is-active" style="background-image:url('assets/window-slide-day.jpg')"></div>
            <div class="window__slide window__slide--sunset"></div>
            <div class="window__slide window__slide--night"></div>
            <div class="window__shade"></div>
            <div class="window__reflection"></div>
          </div>
          <div class="window__handle"></div>
        </div>
      </div>
    </div>
  </section>

  <script src="carousel.js"></script>
</body>
</html>
